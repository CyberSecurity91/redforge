name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: Check the bundle stays small
        run: |
          size=$(stat -c%s dist/assets/index-*.js)
          echo "entry bundle: $size bytes"
          test "$size" -lt 600000 || { echo "entry bundle grew past 600 kB"; exit 1; }
