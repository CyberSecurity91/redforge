# RedForge — static hosting config for the built SPA.
# Copied to /etc/nginx/conf.d/default.conf by the runtime stage of the Dockerfile.
#
# The app is a hash-free client-side router (React Router 8), so every unknown
# path must fall back to index.html or a deep link such as /jwt-decoder 404s.

server {
    listen       8080;
    listen  [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # No server-side code exists, so nothing should ever be uploaded.
    client_max_body_size 1m;

    charset utf-8;
    charset_types text/css application/javascript application/json image/svg+xml;

    # ---------------------------------------------------------------------
    # Security headers. Everything the tools generate is produced in the
    # browser; the page never talks to a backend, so the policy is strict.
    # ---------------------------------------------------------------------
    add_header X-Content-Type-Options   "nosniff"            always;
    add_header X-Frame-Options          "DENY"               always;
    add_header Referrer-Policy          "no-referrer"        always;
    add_header Cross-Origin-Opener-Policy "same-origin"      always;
    add_header Cross-Origin-Resource-Policy "same-origin"    always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy  "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

    # Long-lived immutable assets: Vite fingerprints everything in /assets.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The entry document must never be cached, otherwise a rebuild leaves
    # clients pointing at deleted asset hashes. The security headers are
    # repeated here because any add_header in a location replaces the
    # server-level set wholesale.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options   "nosniff"            always;
        add_header X-Frame-Options          "DENY"               always;
        add_header Referrer-Policy          "no-referrer"        always;
        add_header Cross-Origin-Opener-Policy "same-origin"      always;
        add_header Cross-Origin-Resource-Policy "same-origin"    always;
        add_header Permissions-Policy       "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy  "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type "text/plain; charset=utf-8" always;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # SPA fallback — anything that is not a real file becomes the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Dotfiles are never served.
    location ~ /\. {
        return 404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml text/xml application/xml;
}
